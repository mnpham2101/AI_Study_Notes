<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 532" width="880" height="532" role="img" aria-labelledby="t">
<title id="t">Semantic search: process flow</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fa8"/></marker></defs>
<rect x="0" y="0" width="880" height="532" rx="10" fill="#ffffff" stroke="#d0d7e2"/>
<text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2733">Semantic search: process flow</text>
<rect x="120" y="56" width="640" height="100" rx="10" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5"/>
<text x="140" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2733">Step 1: Create input text</text>
<text x="140" y="114" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">func:</tspan> create_article_text(article)</text>
<text x="140" y="138" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">returns:</tspan> article_texts  (list of formatted strings)</text>
<line x1="440" y1="156" x2="440" y2="218" stroke="#2f5fa8" stroke-width="2" marker-end="url(#ah)"/>
<text x="456" y="193" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b2733">article_texts</text>
<rect x="120" y="220" width="640" height="100" rx="10" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5"/>
<text x="140" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2733">Step 2: Create embeddings</text>
<text x="140" y="278" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">func:</tspan> create_embeddings(texts)</text>
<text x="140" y="302" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">returns:</tspan> response_dict  (one embedding per text)</text>
<line x1="440" y1="320" x2="440" y2="406" stroke="#2f5fa8" stroke-width="2" marker-end="url(#ah)"/>
<text x="456" y="349" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b2733">response_dict   (document embeddings)</text>
<text x="456" y="369" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b2733">query_vector     (embedding of the searched text)</text>
<text x="456" y="389" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b2733">n                (number of results)</text>
<rect x="120" y="408" width="640" height="100" rx="10" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5"/>
<text x="140" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2733">Step 3: Find the closest results</text>
<text x="140" y="466" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">func:</tspan> find_n_closest(query_vector, response_dict, n)</text>
<text x="140" y="490" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b2733"><tspan font-weight="700">returns:</tspan> distances  (sorted list of {distance, index})</text>
</svg>
